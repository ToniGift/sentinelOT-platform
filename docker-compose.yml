services:
  app:
    build: .
    env_file: .env
    environment:
      STATE_DIR: /app/state
      TRUST_PROXY: "1"
    volumes:
      - app_state:/app/state
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # AlarmOps (simulation only). Its page uses root paths, so it gets its own port.
  alarmops:
    build: ./alarmops
    ports:
      - "8080:8080"
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app_state:
  caddy_data:
  caddy_config:
